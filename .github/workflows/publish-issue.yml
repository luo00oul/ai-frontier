name: Import issue and publish
on:
  workflow_dispatch:
    inputs:
      issue_json:
        description: '完整单期 JSON 对象（先核对来源；不会覆盖已有专题）'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ai-frontier-publish
  cancel-in-progress: false
jobs:
  import:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Write input as data
        env:
          ISSUE_JSON: ${{ inputs.issue_json }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          obj=json.loads(os.environ['ISSUE_JSON'])
          Path('/tmp/incoming-issue.json').write_text(json.dumps(obj,ensure_ascii=False))
          PY
      - name: Validate and add issue
        run: python3 scripts/add_issue.py /tmp/incoming-issue.json
      - name: Build
        run: python3 scripts/build.py
      - name: Commit validated content
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/issues.json
          if ! git diff --staged --quiet; then
            git commit -m 'content: publish validated AI frontier issue'
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: import
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
